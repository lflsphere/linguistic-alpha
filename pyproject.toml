[project]
name = "linguistic-alpha"
version = "0.1.0"
description = "Linguistic signals from earnings-call transcripts for predicting post-call CAR (S&P 500)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "openpyxl>=3.1",   # legacy panel.xlsx adapter
]

[project.optional-dependencies]
# Live WRDS pulls (data/wrds_pull.py). File-based loaders never need this.
wrds = ["wrds>=3.2"]
# Econometrics and ML for Model A / Model B.
models = ["statsmodels>=0.14", "scikit-learn>=1.4"]
# Heavy NLP backends for FinBERT / embeddings / LLM features (not wired yet).
nlp = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
la = "linguistic_alpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linguistic_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
